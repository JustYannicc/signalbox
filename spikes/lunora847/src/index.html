<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Signalbox sync spike</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, sans-serif;
      background: light-dark(#fafafa, #171717);
      color: light-dark(#252525, #f0f0f0);
    }
    body {
      margin: 0;
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      min-height: 100dvh;
    }
    aside {
      padding: 24px 16px;
      border-inline-end: 1px solid light-dark(#ddd, #444);
    }
    main {
      padding: 32px;
      max-width: 920px;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 8px;
    }
    p {
      max-width: 65ch;
      line-height: 1.5;
    }
    ul {
      padding: 0;
      list-style: none;
    }
    #folders li {
      padding: 12px 8px;
    }
    #folders [aria-current] {
      font-weight: 600;
      background: light-dark(#eee, #333);
    }
    #threads li {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px 20px;
      padding: 16px 0;
      border-bottom: 1px solid light-dark(#ddd, #444);
    }
    #threads span {
      overflow-wrap: anywhere;
    }
    small {
      grid-column: 1;
      color: light-dark(#555, #bbb);
    }
    button {
      grid-column: 2;
      grid-row: 1/3;
      min-width: 64px;
      padding: 8px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    button:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 3px;
    }
    button:hover {
      filter: brightness(0.9);
    }
    output {
      display: block;
      min-height: 24px;
      margin: 16px 0;
    }
    @media (max-width: 600px) {
      body {
        grid-template-columns: 1fr;
      }
      aside {
        border-inline-end: 0;
        border-bottom: 1px solid light-dark(#ddd, #444);
        padding: 16px;
      }
      main {
        padding: 20px;
      }
      #folders {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }
    }
  </style>
  <aside aria-label="Sidebar">
    <strong>Signalbox</strong>
    <ul id="folders" aria-label="Folders">
      <li>Loading folders…</li>
    </ul>
  </aside>
  <main>
    <h1>Spike folder</h1>
    <p>Synthetic data for #847. This measures Lunora sync; it is not the real catalog.</p>
    <output id="connection" aria-live="polite">Connecting…</output>
    <ul id="threads" aria-label="Threads">
      <li>Loading threads…</li>
    </ul>
  </main>
  <script type="module" src="/client.js"></script>
</html>
