# Deletes preview resources even when the deploy workflow's path filter no
# longer matches a pull request at close time.
name: Delete Signalbox Cloud preview

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  delete_preview:
    name: Delete preview cloud
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: cloud-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    environment:
      name: cloud-preview
    permissions:
      contents: read
      pull-requests: read
      # Deletes the preview's Runner image (pr-<number>).
      packages: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # Only main's code runs here: no PR code ever sees the token in this job.
      - name: Checkout trusted cleanup
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          # Keep the default persist-credentials: with false, checkout runs
          # `git submodule foreach` in this step, which dies on the vendored
          # gitlink under .repos/ that has no .gitmodules entry.
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@signalbox/cloud...

      - name: Delete preview resources
        run: bash .github/scripts/delete-cloud-preview.sh
