name: Isolated WorkOS grant proof

on:
  workflow_dispatch:
    inputs:
      action:
        description: Deploy or delete the disposable proof environment
        required: true
        default: deploy
        type: choice
        options: [deploy, delete]

permissions:
  contents: read

concurrency:
  group: isolated-workos-grant-proof-883
  cancel-in-progress: false

jobs:
  proof:
    name: Isolated candidate deployment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloud-preview
    env:
      CANDIDATE: aa1be5a3c7f8b00b3c3e931c2b31e1dc1c48a1d0
      PROOF_WORKER: signalbox-auth-proof-883
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: aa1be5a3c7f8b00b3c3e931c2b31e1dc1c48a1d0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Validate isolation and write temporary config
        env:
          PROOF_ACTION: ${{ inputs.action }}
          E2E_WORKOS_CLIENT_ID: ${{ secrets.E2E_WORKOS_CLIENT_ID }}
          E2E_WORKOS_API_KEY: ${{ secrets.E2E_WORKOS_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          const hash = (value) => crypto.createHash('sha256').update(value).digest('hex');
          const must = (condition, message) => { if (!condition) throw new Error(message); };
          const cf = async (suffix) => fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}${suffix}`, {
            headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` },
          });
          (async () => {
            must(execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim() === process.env.CANDIDATE, 'Unexpected candidate');
            must(['deploy', 'delete'].includes(process.env.PROOF_ACTION), 'Unexpected action');
            must(process.env.CLOUDFLARE_ACCOUNT_ID && process.env.CLOUDFLARE_API_TOKEN, 'Cloudflare credentials missing');
            const current = await cf(`/workers/scripts/${process.env.PROOF_WORKER}/settings`);
            if (current.status !== 404) {
              must(current.ok, 'Cannot inspect the proof Worker');
              const settings = await current.json();
              must(settings.success, 'Cannot read proof Worker settings');
              const vars = Object.fromEntries(settings.result.bindings.filter(b => b.type === 'plain_text').map(b => [b.name, b.text]));
              must(vars.PROOF_CANDIDATE === process.env.CANDIDATE && vars.ENVIRONMENT_ID === 'cloud-auth-proof-883', 'Existing Worker is not this proof environment');
            } else {
              must(process.env.PROOF_ACTION === 'deploy', 'Proof environment does not exist');
            }
            const domainResponse = await cf('/workers/subdomain');
            must(domainResponse.ok, 'Cannot read the Workers subdomain');
            const domain = await domainResponse.json();
            must(domain.success && /^[a-z0-9-]+$/.test(domain.result.subdomain), 'Invalid Workers subdomain');
            const origin = `https://${process.env.PROOF_WORKER}.${domain.result.subdomain}.workers.dev`;
            console.log(`::add-mask::${origin}`);
            const config = {
              name: process.env.PROOF_WORKER,
              main: path.resolve('apps/cloud/src/worker.ts'),
              compatibility_date: '2026-10-01',
              compatibility_flags: ['nodejs_compat', 'legacy_module_registry'],
              workers_dev: true,
              preview_urls: false,
              routes: [],
              limits: { cpu_ms: 300000 },
              assets: { directory: path.resolve('apps/web/dist'), binding: 'ASSETS', not_found_handling: 'single-page-application', run_worker_first: true },
              durable_objects: { bindings: [
                ['USERS', 'UserObject'], ['THREADS', 'ThreadObject'], ['POOLS', 'PoolObject'], ['DRIVES', 'DriveObject'], ['PREVIEW_LINKS', 'PreviewLinkRegistry'],
              ].map(([name, class_name]) => ({ name, class_name })) },
              migrations: [{ tag: 'proof-v1', new_sqlite_classes: ['UserObject', 'ThreadObject', 'PoolObject', 'DriveObject', 'PreviewLinkRegistry'] }],
              r2_buckets: [{ binding: 'DRIVE_PACKS', bucket_name: 'signalbox-drives-preview', jurisdiction: 'eu' }],
              vars: {
                ENVIRONMENT_ID: 'cloud-auth-proof-883',
                ENVIRONMENT_LABEL: 'WorkOS grant proof',
                PROOF_CANDIDATE: process.env.CANDIDATE,
                CLOUD_URL: origin,
                DRIVE_PACKS_PREFIX: 'auth-proof-883/',
              },
              observability: { enabled: true, logs: { enabled: true, invocation_logs: true } },
            };
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'auth-proof.json'), JSON.stringify(config), { mode: 0o600 });
            if (process.env.PROOF_ACTION === 'delete') return;
            const clientId = process.env.E2E_WORKOS_CLIENT_ID?.trim();
            const apiKey = process.env.E2E_WORKOS_API_KEY?.trim();
            must(clientId && apiKey?.startsWith('sk_test_'), 'Dedicated E2E credentials missing');
            must(hash(clientId) === '600d0fb6026b83de9805abd866063df44dc80e25948f4caf05b0ac8102e00a0f', 'Unexpected E2E client');
            const identityResponse = await fetch(`https://api.workos.com/user_management/users/external_id/${encodeURIComponent('test:pr883:multi-org')}`, {
              headers: { Authorization: `Bearer ${apiKey}` },
            });
            must(identityResponse.ok, 'E2E key cannot read the expected test identity');
            const identity = await identityResponse.json();
            must(typeof identity.id === 'string' && hash(identity.id) === '7dc3de9899f7a9542d5d899ae87bcf0936bd43db2d11311dc16a218d5f9f3d50', 'Unexpected E2E key realm');
            const sessionSecret = crypto.randomBytes(48).toString('hex');
            console.log(`::add-mask::${sessionSecret}`);
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'auth-proof-secrets.json'), JSON.stringify({
              T3CODE_WORKOS_CLIENT_ID: clientId,
              T3CODE_WORKOS_API_KEY: apiKey,
              SESSION_SECRET: sessionSecret,
            }), { mode: 0o600 });
            console.log('Dedicated E2E realm and candidate validated.');
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@signalbox/cloud...
              - --filter=@t3tools/web...

      - name: Build candidate web app
        if: inputs.action == 'deploy'
        run: vp run --filter @t3tools/web build
        env:
          T3CODE_WEB_SOURCEMAP: "false"

      - name: Deploy isolated Worker
        if: inputs.action == 'deploy'
        working-directory: apps/cloud
        run: |
          if ! ./node_modules/.bin/wrangler deploy --config "$RUNNER_TEMP/auth-proof.json" --secrets-file "$RUNNER_TEMP/auth-proof-secrets.json" > "$RUNNER_TEMP/auth-proof-deploy.log" 2>&1; then
            node -e 'const fs=require("node:fs");const text=fs.readFileSync(process.env.RUNNER_TEMP+"/auth-proof-deploy.log","utf8");console.error(text.replace(/https?:\/\/[^\s)]+/g,"[url]").replace(/\/(?:home|tmp|Users)\/[^\s)]+/g,"[path]").replace(/(?:client_|user_|org_|environment_|redir_)[A-Za-z0-9_]+/g,"[id]").split("\n").slice(-60).join("\n"));'
            echo 'Isolated deployment failed.'
            exit 1
          fi
          echo 'Isolated candidate deployed.'

      - name: Delete isolated Worker
        if: inputs.action == 'delete'
        working-directory: apps/cloud
        run: |
          if ! ./node_modules/.bin/wrangler delete --config "$RUNNER_TEMP/auth-proof.json" --force > "$RUNNER_TEMP/auth-proof-delete.log" 2>&1; then
            echo 'Isolated deletion failed.'
            exit 1
          fi
          echo 'Isolated candidate deleted.'

      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/auth-proof-secrets.json"
