# Signalbox-only: deploys Signalbox Cloud (apps/cloud) to Cloudflare. Its own
# file so upstream merges never touch it. Setup: docs/operations/cloud.md.
#
# - main deploys production at app.signalbox.run, and its ModelGateway at
#   gateway.signalbox.run.
# - Pull requests from JustYannicc get a preview at preview-<number>.signalbox.run:
#   its own Worker, Durable Objects and ModelGateway (gateway-preview-<number>),
#   deleted when the pull request closes.
name: Deploy Signalbox Cloud

on:
  push:
    branches:
      - main
    paths: &cloud-paths
      - apps/cloud/**
      - apps/web/**
      - packages/account/**
      - packages/runner-protocol/**
      - packages/client-runtime/**
      - packages/contracts/**
      - packages/shared/**
      # Light machines run the Runner built with the Worker.
      - apps/server/src/signalbox/runner/**
      - apps/server/src/orchestration-v2/Adapters/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-cloud.yml
      # Production's cleanup token is derived by this script. The other cleanup
      # scripts run from main's checkout when a PR closes, so they need no deploy.
      - .github/scripts/preview-cleanup-token.sh
      # Every deploy reconnects every client, so skip what never ships.
      - "!**/*.test.ts"
      - "!**/*.test.tsx"
      - "!**/*.md"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths: *cloud-paths
  # Redeploys main, e.g. after rotating a secret.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy_production:
    name: Deploy production cloud
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: cloud-production
      cancel-in-progress: false
    environment:
      name: cloud-production
      url: https://app.signalbox.run
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - &setup
        name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@signalbox/cloud...
              - --filter=@t3tools/web...
              - --filter=t3...

      # The cloud serves this build from its own origin.
      - &build
        name: Build web app
        run: vp run --filter @t3tools/web build
        env:
          # Sourcemaps change every build and would be served publicly.
          T3CODE_WEB_SOURCEMAP: "false"
          # The sidebar feedback button sends here; without it the button hides.
          VITE_T3CODE_FEEDBACK_DSN: ${{ vars.VITE_T3CODE_FEEDBACK_DSN }}

      # Light machines' container image is built from this Runner bundle.
      - &bundle_runner
        name: Bundle the Runner
        working-directory: apps/server
        run: vp run runner:bundle

      - name: Write Worker secrets
        run: |
          umask 077
          preview_cleanup_token="$(bash .github/scripts/preview-cleanup-token.sh)"
          jq -n \
            --arg SESSION_SECRET "$SESSION_SECRET" \
            --arg PREVIEW_CLEANUP_TOKEN "$preview_cleanup_token" \
            --arg T3CODE_WORKOS_API_KEY "$T3CODE_WORKOS_API_KEY" \
            --arg T3CODE_WORKOS_WEBHOOK_SECRET "$T3CODE_WORKOS_WEBHOOK_SECRET" \
            --arg BOAT_API_KEY "$BOAT_API_KEY" \
            '$ARGS.named' > "$RUNNER_TEMP/cloud-secrets.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SESSION_SECRET: ${{ secrets.CLOUD_SESSION_SECRET }}
          T3CODE_WORKOS_API_KEY: ${{ secrets.T3CODE_WORKOS_API_KEY }}
          # Optional: membership changes from WorkOS at once (docs/operations/cloud.md).
          T3CODE_WORKOS_WEBHOOK_SECRET: ${{ secrets.T3CODE_WORKOS_WEBHOOK_SECRET }}
          # Optional: Claude and Codex on boat VMs (docs/operations/cloud.md).
          BOAT_API_KEY: ${{ secrets.BOAT_API_KEY }}

      # Secrets ship with the version, so no deploy runs without them.
      - name: Deploy
        working-directory: apps/cloud
        run: >-
          ./node_modules/.bin/wrangler deploy --env ""
          --secrets-file "$RUNNER_TEMP/cloud-secrets.json"
          --var "T3CODE_WORKOS_CLIENT_ID:$T3CODE_WORKOS_CLIENT_ID"
          --var "CLOUD_URL:https://app.signalbox.run"
          --var "MACHINE_BACKEND:$MACHINE_BACKEND"
          --var "MODEL_GATEWAY_URL:$MODEL_GATEWAY_URL"
          --var "SIGNALBOX_POSTHOG_KEY:$SIGNALBOX_POSTHOG_KEY"
          --var "SIGNALBOX_POSTHOG_HOST:$SIGNALBOX_POSTHOG_HOST"
          --var "PREVIEW_DOMAIN:$PREVIEW_DOMAIN"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          T3CODE_WORKOS_CLIENT_ID: ${{ vars.T3CODE_WORKOS_CLIENT_ID }}
          MACHINE_BACKEND: ${{ vars.MACHINE_BACKEND }}
          MODEL_GATEWAY_URL: ${{ vars.MODEL_GATEWAY_URL }}
          # Optional: `cloud.*` usage analytics (#116). Production only, so
          # previews never mix test turns into the cost data.
          SIGNALBOX_POSTHOG_KEY: ${{ vars.SIGNALBOX_POSTHOG_KEY }}
          SIGNALBOX_POSTHOG_HOST: ${{ vars.SIGNALBOX_POSTHOG_HOST }}
          PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN }}

      # After the cloud, whose `ModelGrants` entrypoint it calls.
      - name: Deploy ModelGateway
        working-directory: apps/cloud
        run: ./node_modules/.bin/wrangler deploy --config wrangler.model-gateway.jsonc --env ""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - &cleanup
        name: Remove secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/cloud-secrets.json"

  # Same-repository pull requests opened by JustYannicc (including agents
  # working under that account). Forks never get a preview or the secrets.
  deploy_preview:
    name: Deploy preview cloud
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.user.login == 'JustYannicc' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: cloud-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    environment:
      name: cloud-preview
      url: https://preview-${{ github.event.pull_request.number }}.signalbox.run
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - *checkout
      - *setup
      - *build
      - *bundle_runner

      # Each preview signs its own sessions: stable across its redeploys, and
      # never accepted by production or another preview.
      - name: Write Worker secrets
        run: |
          umask 077
          session_secret="$(printf 'preview-%s' "$PR_NUMBER" | openssl dgst -sha256 -hmac "$PREVIEW_SESSION_SECRET" -r | cut -d' ' -f1)"
          jq -n \
            --arg SESSION_SECRET "$session_secret" \
            --arg T3CODE_WORKOS_API_KEY "$T3CODE_WORKOS_API_KEY" \
            --arg BOAT_API_KEY "$BOAT_API_KEY" \
            '$ARGS.named' > "$RUNNER_TEMP/cloud-secrets.json"
        env:
          PREVIEW_SESSION_SECRET: ${{ secrets.CLOUD_PREVIEW_SESSION_SECRET }}
          T3CODE_WORKOS_API_KEY: ${{ secrets.T3CODE_WORKOS_API_KEY }}
          BOAT_API_KEY: ${{ secrets.BOAT_API_KEY }}

      # A reopened pull request may use the same preview origin as before.
      # This job already runs PR code (the build, wrangler) with the Cloudflare
      # token, which is enough to derive the cleanup token. Main's checkout isn't
      # a security boundary: it only means a reopen uses main's reviewed call,
      # not whatever the PR changed it to.
      - name: Checkout trusted preview cleanup scripts
        if: github.event.action == 'reopened'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .trusted-cleanup
          # Keep the default persist-credentials: with false, checkout runs
          # `git submodule foreach` in this step, which dies on the vendored
          # gitlink under .repos/ that has no .gitmodules entry.
          sparse-checkout: |
            /.github/scripts
          sparse-checkout-cone-mode: false

      - name: Reopen production preview links
        if: github.event.action == 'reopened'
        run: bash .trusted-cleanup/.github/scripts/call-preview-cleanup.sh activate "$PR_NUMBER"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Containers and service bindings have no command-line names, so the
      # preview deploys from copies of the configs with its own names.
      - name: Name the preview's containers and gateway binding
        working-directory: apps/cloud
        run: |
          sed "s/PR_NUMBER/$PR_NUMBER/g" wrangler.jsonc > wrangler.preview.jsonc
          sed "s/PR_NUMBER/$PR_NUMBER/g" wrangler.model-gateway.jsonc > wrangler.model-gateway.preview.jsonc

      # Heavy machines run this pull request's Runner image, which runner-image.yml
      # publishes as `pr-<number>`. One started before that build lands fails
      # to pull; starting it again after the build works.
      - name: Deploy
        working-directory: apps/cloud
        run: >-
          ./node_modules/.bin/wrangler deploy --config wrangler.preview.jsonc --env preview
          --name "signalbox-cloud-pr-$PR_NUMBER"
          --domain "preview-$PR_NUMBER.signalbox.run"
          --secrets-file "$RUNNER_TEMP/cloud-secrets.json"
          --var "ENVIRONMENT_ID:cloud-preview-$PR_NUMBER"
          --var "ENVIRONMENT_LABEL:Signalbox Cloud (PR #$PR_NUMBER)"
          --var "T3CODE_WORKOS_CLIENT_ID:$T3CODE_WORKOS_CLIENT_ID"
          --var "CLOUD_URL:https://preview-$PR_NUMBER.signalbox.run"
          --var "DRIVE_PACKS_PREFIX:pr-$PR_NUMBER/"
          --var "MACHINE_BACKEND:$MACHINE_BACKEND"
          --var "MODEL_GATEWAY_URL:https://gateway-preview-$PR_NUMBER.signalbox.run"
          --var "RUNNER_IMAGE:ghcr.io/justyannicc/signalbox-runner:pr-$PR_NUMBER"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          T3CODE_WORKOS_CLIENT_ID: ${{ vars.T3CODE_WORKOS_CLIENT_ID }}
          MACHINE_BACKEND: ${{ vars.MACHINE_BACKEND }}

      # The preview's own gateway: its binding reaches only this preview's Worker.
      - name: Deploy ModelGateway
        working-directory: apps/cloud
        run: >-
          ./node_modules/.bin/wrangler deploy --config wrangler.model-gateway.preview.jsonc
          --env preview
          --name "signalbox-model-gateway-pr-$PR_NUMBER"
          --domain "gateway-preview-$PR_NUMBER.signalbox.run"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - *cleanup

  # Deletes the preview's Workers, containers, drive packs and production links.
  delete_preview:
    name: Delete preview cloud
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cloud-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    environment:
      name: cloud-preview
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # Only main's scripts run here: no PR code ever sees the token in this job.
      - name: Checkout trusted cleanup scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          # Keep the default persist-credentials: with false, checkout runs
          # `git submodule foreach` in this step, which dies on the vendored
          # gitlink under .repos/ that has no .gitmodules entry.
          sparse-checkout: |
            /.github/scripts
          sparse-checkout-cone-mode: false

      - name: Delete preview resources
        run: bash .github/scripts/delete-cloud-preview.sh
