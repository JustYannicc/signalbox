# Signalbox-only: deploys Signalbox Cloud (apps/cloud) to Cloudflare through its
# Alchemy stack (apps/cloud/alchemy.run.ts). Its own file so upstream merges
# never touch it. Setup: docs/operations/cloud.md.
#
# - main deploys the `production` stage: app.signalbox.run, and its
#   ModelGateway at gateway.signalbox.run.
# - Pull requests from JustYannicc deploy the `pr-<number>` stage at
#   preview-<number>.signalbox.run: its own Worker, Durable Objects and
#   ModelGateway (gateway-preview-<number>), destroyed when the pull request
#   closes. They also plan production, to show what merging would do.
#
# Every deploy plans first and stops if the plan replaces, deletes, orphans or
# unbinds anything (apps/cloud/infra/plan.sh). Plans are in the job summary.
name: Deploy Signalbox Cloud

on:
  push:
    branches:
      - main
    paths: &cloud-paths
      - apps/cloud/**
      - apps/web/**
      - packages/account/**
      - packages/runner-protocol/**
      - packages/client-runtime/**
      - packages/contracts/**
      - packages/shared/**
      # Light machines run the Runner built with the Worker, and a preview's
      # boat machines its own image (runner-image.yml has the same paths).
      - apps/server/src/signalbox/runner/**
      - apps/server/src/orchestration-v2/Adapters/**
      - .github/workflows/runner-image.yml
      - pnpm-lock.yaml
      - patches/alchemy@*.patch
      - .github/workflows/deploy-cloud.yml
      # Production's cleanup token is derived by this script. The other cleanup
      # scripts run from main's checkout when a PR closes, so they need no deploy.
      - .github/scripts/preview-cleanup-token.sh
      # Every deploy reconnects every client, so skip what never ships.
      - "!**/*.test.ts"
      - "!**/*.test.tsx"
      - "!**/*.md"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths: *cloud-paths
  # Redeploys main, e.g. after rotating a secret.
  workflow_dispatch:

permissions:
  contents: read

env:
  ALCHEMY_TELEMETRY_DISABLED: "1"

jobs:
  deploy_production:
    name: Deploy production cloud
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: cloud-production
      cancel-in-progress: false
    environment:
      name: cloud-production
      url: https://app.signalbox.run
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      STAGE: production
      T3CODE_WORKOS_CLIENT_ID: ${{ vars.T3CODE_WORKOS_CLIENT_ID }}
      # The MCP authorization server (`apps/cloud/src/api/mcpRoutes.ts`); unset, MCP takes keys only.
      WORKOS_AUTHKIT_DOMAIN: ${{ vars.WORKOS_AUTHKIT_DOMAIN }}
      MACHINE_BACKEND: ${{ vars.MACHINE_BACKEND }}
      # Optional: the Executor local harness setup adds as an MCP server (src/localKeys/).
      EXECUTOR_MCP_URL: ${{ vars.EXECUTOR_MCP_URL }}
      # Optional: `cloud.*` usage analytics (#116). Production only, so
      # previews never mix test turns into the cost data.
      SIGNALBOX_POSTHOG_KEY: ${{ vars.SIGNALBOX_POSTHOG_KEY }}
      SIGNALBOX_POSTHOG_HOST: ${{ vars.SIGNALBOX_POSTHOG_HOST }}
      SESSION_SECRET: ${{ secrets.CLOUD_SESSION_SECRET }}
      T3CODE_WORKOS_API_KEY: ${{ secrets.T3CODE_WORKOS_API_KEY }}
      # Optional: membership changes from WorkOS at once (docs/operations/cloud.md).
      T3CODE_WORKOS_WEBHOOK_SECRET: ${{ secrets.T3CODE_WORKOS_WEBHOOK_SECRET }}
      # Optional: Claude and Codex on boat VMs (docs/operations/cloud.md).
      BOAT_API_KEY: ${{ secrets.BOAT_API_KEY }}
      # Optional: pushes to phones (docs/operations/cloud.md, "Push notifications").
      APNS_TEAM_ID: ${{ vars.APNS_TEAM_ID }}
      APNS_KEY_ID: ${{ vars.APNS_KEY_ID }}
      APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
      FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - &setup
        name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@signalbox/cloud...
              - --filter=@t3tools/web...
              - --filter=t3...

      # The cloud serves this build from its own origin.
      - &build
        name: Build web app
        run: vp run --filter @t3tools/web build
        env:
          # Sourcemaps change every build and would be served publicly.
          T3CODE_WEB_SOURCEMAP: "false"
          # The sidebar feedback button sends here; without it the button hides.
          VITE_T3CODE_FEEDBACK_DSN: ${{ vars.VITE_T3CODE_FEEDBACK_DSN }}

      # Light machines' container image is built from this Runner bundle.
      - &bundle_runner
        name: Bundle the Runner
        working-directory: apps/server
        run: vp run runner:bundle

      - name: Derive the preview cleanup token
        run: |
          token="$(bash .github/scripts/preview-cleanup-token.sh)"
          echo "::add-mask::$token"
          echo "PREVIEW_CLEANUP_TOKEN=$token" >> "$GITHUB_ENV"

      # Nothing deploys unless the plan keeps every Worker, Durable Object,
      # container and bucket where it is.
      - &plan
        name: Plan
        working-directory: apps/cloud
        run: bash infra/plan.sh "$STAGE"

      - &deploy
        name: Deploy
        working-directory: apps/cloud
        run: ./node_modules/.bin/alchemy deploy --stage "$STAGE" --yes --no-input

  # Whether the pull request changes what boat machines run (the paths
  # runner-image.yml builds on). Then its preview runs its own Runner image.
  runner_changes:
    name: Runner changes
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.user.login == 'JustYannicc' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      changed: ${{ steps.files.outputs.changed }}
    steps:
      - name: List the pull request's files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # The files endpoint stops at 3000 files: a list shorter than the
          # pull request's count builds the image to be safe.
          expected="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.changed_files')"
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          listed="$(grep -c . <<< "$files" || true)"
          # runner-image.yml's paths.
          if [[ "$listed" -lt "$expected" ]] ||
            grep -Eq '^(apps/server/src/signalbox/runner/|apps/server/src/orchestration-v2/Adapters/|packages/runner-protocol/|\.github/workflows/runner-image\.yml$)' <<< "$files"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # Published as ghcr.io/justyannicc/signalbox-runner:pr-<number> before the
  # preview deploys, so its first boat machine can pull it.
  runner_image:
    name: Runner image
    needs: runner_changes
    if: needs.runner_changes.outputs.changed == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/runner-image.yml
    with:
      pr_number: ${{ format('{0}', github.event.pull_request.number) }}

  # Same-repository pull requests opened by JustYannicc (including agents
  # working under that account). Forks never get a preview or the secrets.
  deploy_preview:
    name: Deploy preview cloud
    needs: [runner_changes, runner_image]
    # Without a Runner change the image job skips, and the preview runs `nightly`.
    if: >-
      !cancelled() &&
      needs.runner_changes.result == 'success' &&
      (needs.runner_image.result == 'success' || needs.runner_image.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: cloud-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    environment:
      name: cloud-preview
      url: https://preview-${{ github.event.pull_request.number }}.signalbox.run
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      STAGE: pr-${{ github.event.pull_request.number }}
      T3CODE_WORKOS_CLIENT_ID: ${{ vars.T3CODE_WORKOS_CLIENT_ID }}
      # The MCP authorization server (`apps/cloud/src/api/mcpRoutes.ts`); unset, MCP takes keys only.
      WORKOS_AUTHKIT_DOMAIN: ${{ vars.WORKOS_AUTHKIT_DOMAIN }}
      MACHINE_BACKEND: ${{ vars.MACHINE_BACKEND }}
      # Optional: the Executor local harness setup adds as an MCP server (src/localKeys/).
      EXECUTOR_MCP_URL: ${{ vars.EXECUTOR_MCP_URL }}
      T3CODE_WORKOS_API_KEY: ${{ secrets.T3CODE_WORKOS_API_KEY }}
      BOAT_API_KEY: ${{ secrets.BOAT_API_KEY }}
      # The pull request's own Runner on boat machines, when it changes the Runner.
      RUNNER_IMAGE: ${{ needs.runner_image.outputs.image }}
      # Optional: pushes to phones (docs/operations/cloud.md, "Push notifications").
      APNS_TEAM_ID: ${{ vars.APNS_TEAM_ID }}
      APNS_KEY_ID: ${{ vars.APNS_KEY_ID }}
      APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
      FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
    steps:
      - *checkout
      - *setup
      - *build
      - *bundle_runner

      # Each preview signs its own sessions: stable across its redeploys, and
      # never accepted by production or another preview.
      - name: Derive the preview's session secret
        run: |
          set -o pipefail
          : "${PREVIEW_SESSION_SECRET:?CLOUD_PREVIEW_SESSION_SECRET is not set}"
          secret="$(printf 'preview-%s' "$PR_NUMBER" | openssl dgst -sha256 -hmac "$PREVIEW_SESSION_SECRET" -r | cut -d' ' -f1)"
          echo "::add-mask::$secret"
          echo "SESSION_SECRET=$secret" >> "$GITHUB_ENV"
        env:
          PREVIEW_SESSION_SECRET: ${{ secrets.CLOUD_PREVIEW_SESSION_SECRET }}

      # A reopened pull request may use the same preview origin as before.
      # This job already runs PR code (the build, the stack) with the Cloudflare
      # token, which is enough to derive the cleanup token. Main's checkout isn't
      # a security boundary: it only means a reopen uses main's reviewed call,
      # not whatever the PR changed it to.
      - name: Checkout trusted preview cleanup scripts
        if: github.event.action == 'reopened'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .trusted-cleanup
          # Keep the default persist-credentials: with false, checkout runs
          # `git submodule foreach` in this step, which dies on the vendored
          # gitlink under .repos/ that has no .gitmodules entry.
          sparse-checkout: |
            /.github/scripts
          sparse-checkout-cone-mode: false

      - name: Reopen production preview links
        if: github.event.action == 'reopened'
        run: bash .trusted-cleanup/.github/scripts/call-preview-cleanup.sh activate "$PR_NUMBER"

      - *plan
      - *deploy

      # Production runs main as it is now, which can be ahead of this checkout:
      # merge it in, and rebuild when it brought anything.
      - name: Merge main for the production plan
        id: merge_main
        run: |
          git fetch --no-tags --filter=blob:none --unshallow origin +refs/heads/main:refs/remotes/origin/main
          bash apps/cloud/infra/merge-main.sh origin/main

      - name: Rebuild with main for the production plan
        if: steps.merge_main.outputs.merged == 'true'
        run: |
          vp install --filter=@signalbox/cloud... --filter=@t3tools/web... --filter=t3...
          vp run --filter @t3tools/web build
          (cd apps/server && vp run runner:bundle)
        env:
          T3CODE_WEB_SOURCEMAP: "false"
          VITE_T3CODE_FEEDBACK_DSN: ${{ vars.VITE_T3CODE_FEEDBACK_DSN }}

      # What merging this pull request would do to production. Placeholder
      # secrets: a plan uploads nothing. The production deploy plans again
      # with the real values, and that plan is what stops a bad deploy.
      - name: Plan production
        working-directory: apps/cloud
        run: |
          SESSION_SECRET=plan-only T3CODE_WORKOS_API_KEY=plan-only PREVIEW_CLEANUP_TOKEN=plan-only \
            bash infra/plan.sh production

  # Destroys the preview's stage, then asks production to drop its drive packs
  # and pool links.
  delete_preview:
    name: Delete preview cloud
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: cloud-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    environment:
      name: cloud-preview
    permissions:
      contents: read
      # Deletes the preview's Runner image (pr-<number>).
      packages: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # Only main's code runs here: no PR code ever sees the token in this job.
      - name: Checkout trusted cleanup
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          # Keep the default persist-credentials: with false, checkout runs
          # `git submodule foreach` in this step, which dies on the vendored
          # gitlink under .repos/ that has no .gitmodules entry.
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@signalbox/cloud...

      - name: Delete preview resources
        run: bash .github/scripts/delete-cloud-preview.sh
