# Signalbox-only CI. Upstream's ci.yml targets Blacksmith runners this fork does
# not have, and every inherited upstream workflow is disabled in the repository
# settings. This file mirrors ci.yml's checks on GitHub-hosted runners and lives
# in its own file so upstream merges never touch it.
name: Signalbox CI

on:
  pull_request:
  push:
    branches:
      - main
  # The upstream sync dispatches this on its branch: pushes and PRs made with
  # GITHUB_TOKEN start no runs, dispatches do.
  workflow_dispatch:

permissions:
  contents: read

# Let main finish a run while newer merges replace its single pending run.
# PRs still cancel superseded runs.
concurrency:
  group: signalbox-ci-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Reject repository-owned PR assets
        run: |
          files="$(git ls-files .github/pr-assets)"
          if test -n "$files"; then
            printf 'PR evidence must be uploaded to GitHub, not committed:\n%s\n' "$files" >&2
            exit 1
          fi

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check module boundaries
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          git fetch --no-tags https://github.com/pingdotgg/t3code.git main:refs/remotes/upstream/main
          case "$EVENT_NAME" in
            pull_request)
              git fetch --no-tags origin "+refs/heads/$PR_BASE_REF:refs/remotes/origin/$PR_BASE_REF"
              set -- --base "refs/remotes/origin/$PR_BASE_REF" --head "$PR_HEAD_SHA"
              ;;
            push) set -- --base "$BEFORE_SHA" ;;
            *) set -- --base origin/main ;;
          esac
          node --test scripts/boundaries/tests.mjs
          vp run lint:boundaries "$@"

      - name: Check unused code
        run: vp run knip:check

      # Fails when an upstream merge brings T3 names the codemod would rename.
      - name: Check user-facing names
        run: node scripts/rebrand/rebrand.ts --check

      - name: Check
        run: vp check

  typecheck:
    name: Typecheck
    needs: cloud_migrations
    if: ${{ !cancelled() && needs.cloud_migrations.outputs.typecheck != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Typecheck
        run: vpr typecheck

      # Compiler upgrades must preserve the declared TS version and Effect diagnostics.
      - name: Compiler parity and memory
        if: github.event_name == 'pull_request'
        run: |
          changed="$(git diff --name-only HEAD^1 HEAD)"
          if grep -Eq '(^|/)package\.json$|(^|/)tsconfig[^/]*\.json$|^pnpm-workspace\.yaml$|^scripts/(typecheck-parity|typecheck-benchmark|prepare-effect-sdk|tsc-rs-lsp-smoke|lib/(lsp-smoke-client|typecheck-))|^\.codex/lsp-client\.json$|^\.vscode/settings\.json$' <<< "$changed"; then
            node scripts/typecheck-parity.ts --all
            node scripts/typecheck-benchmark.ts HEAD^1
            node scripts/tsc-rs-lsp-smoke.ts
          else
            node scripts/typecheck-parity.ts apps/cloud/tsconfig.json apps/cloud/tsconfig.infra.json
          fi

  build:
    name: Build
    needs: cloud_migrations
    if: ${{ !cancelled() && needs.cloud_migrations.outputs.build != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      # The desktop build compiles the browser secret helper against libsecret.
      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Verify preload bundle output
        run: node apps/desktop/scripts/verify-preload-bundle.mjs

  # Everything except `t3` (apps/server) and the web app, which run in their own jobs.
  # GitHub-hosted runners have half the vCPUs of upstream's, so run half as many
  # package suites at once; at 4, CPU-bound property tests hit Vitest's 5s timeout.
  test:
    name: Test
    needs: cloud_migrations
    if: ${{ !cancelled() && needs.cloud_migrations.outputs.test != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      # The desktop tests compile the browser secret helper.
      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Test preview artifact validation
        run: python3 -B .github/scripts/stage-preview-bundle.test.py

      - name: Test nightly release checks
        run: node --test .github/scripts/check-nightly-release.test.cjs

      - name: Test preview certificate wait
        run: node --test .github/scripts/wait-own-certificate.test.cjs

      - name: Test preview Worker domain verification
        run: node --test .github/scripts/cloudflare-preview-domains.test.cjs

      - name: Test preview deploy cancellation
        run: node --test .github/scripts/cancel-preview-deploys.test.cjs

      # Use Node directly so workflow and infra-only changes still exercise these checks without Vitest discovery.
      - name: Check deploy workflow script sources
        run: node --test scripts/deploy-workflow-policy.tests.mjs scripts/deploy-plan.tests.mjs

      - name: Test CI change selection
        run: node --test .github/scripts/ci-changes.test.cjs

      - name: Test
        env:
          TEST_PACKAGES: ${{ needs.cloud_migrations.outputs.test_packages }}
        run: |
          filters=(--filter '!t3' --filter '!@t3tools/monorepo' --filter '!@t3tools/web')
          if [[ -n "$TEST_PACKAGES" ]]; then
            filters=()
            for package in $TEST_PACKAGES; do filters+=(--filter "$package"); done
          fi
          vp run --parallel --concurrency-limit 2 "${filters[@]}" test

  test_web:
    name: Test Web
    needs: cloud_migrations
    if: ${{ !cancelled() && needs.cloud_migrations.outputs.test_web != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Resolve web browser test requirements
        id: web_browser
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const web = require('./apps/web/package.json');
          if (/--project(?:=|\s+)browser(?:\s|$)/.test(web.scripts.test)) {
            const { version } = require('./apps/web/node_modules/playwright/package.json');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `playwright_version=${version}\n`);
          }
          NODE

      - name: Cache web Chromium
        if: steps.web_browser.outputs.playwright_version != ''
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: web-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.web_browser.outputs.playwright_version }}

      - name: Install Chromium for web browser tests
        if: steps.web_browser.outputs.playwright_version != ''
        run: node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium

      - name: Test
        run: vp run --filter @t3tools/web test

  # apps/server runs its test files one at a time (`fileParallelism: false`);
  # shards spread them over runners, split by recorded duration.
  test_server:
    name: Test Server ${{ matrix.shard }}
    needs: cloud_migrations
    if: ${{ !cancelled() && needs.cloud_migrations.outputs.test_server != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Every shard still covers its share of the full suite. Small PRs need
        # fewer runner startups; main and larger diffs keep the faster split.
        shard: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.changed_files > 0 && github.event.pull_request.changed_files <= 10 && '[1,2,3]' || '[1,2,3,4,5,6]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Install Chromium for server browser integration tests
        run: node apps/server/node_modules/playwright-core/cli.js install --with-deps --only-shell chromium

      - name: Test
        run: vp run --filter t3 test --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  rust:
    name: Rust
    needs: cloud_migrations
    if: ${{ !cancelled() && needs.cloud_migrations.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: |
          for crate in resource-monitor kde-snap-shot hyprland-snap-shot; do
            cargo fmt --manifest-path "native/$crate/Cargo.toml" -- --check
          done

      - name: Test Rust crates
        run: |
          for crate in resource-monitor kde-snap-shot hyprland-snap-shot; do
            cargo test --locked --manifest-path "native/$crate/Cargo.toml"
          done

  release_smoke:
    name: Release Smoke
    needs: cloud_migrations
    if: ${{ !cancelled() && needs.cloud_migrations.outputs.release_smoke != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts

  # Warns about conflicts the PR's merge into its current base adds with upstream.
  # Upstream conflicts are the next sync's cost, not a gate on Signalbox changes.
  # A PR that merges upstream still fails if it drops a `signalbox:` hook line.
  upstream_merge:
    name: Upstream Merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sync: ${{ steps.hooks.outputs.sync }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Fetch upstream
        run: git fetch --no-tags https://github.com/pingdotgg/t3code.git main:refs/remotes/upstream/main

      - name: Fetch current PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --no-tags --filter=blob:none origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          run-install: false

      - name: Check merge with upstream
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request) set -- --base "refs/remotes/origin/$BASE_REF" --head "$HEAD_SHA" --report ;;
            push) set -- --base HEAD --report ;;
            *) set -- --base origin/main ;;
          esac
          node scripts/upstream-sync/check-merge.ts "$@"

      - name: Check hooks survive an upstream merge
        id: hooks
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/upstream-sync/check-hooks.ts --base "refs/remotes/origin/$BASE_REF" --head "$HEAD_SHA"

  # Passes only on a PR that merges upstream T3 Code with its Upstream Merge
  # job green, hooks included. The signalbox folder's Merge gate trusts it to
  # merge sync PRs on its own (#5). Skipped on every other PR, so it stays out
  # of Check's `needs`.
  upstream_sync:
    name: Upstream Sync
    needs: upstream_merge
    if: needs.upstream_merge.outputs.sync == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark an upstream merge with every hook intact
        run: echo "This pull request merges upstream T3 Code and keeps every signalbox hook line."

  # Fails when a PR edits or removes a cloud Durable Object migration that
  # already merged. Reports, never fails, whether its new migrations are
  # additive or ship-only (step summary and the `verdict` output).
  cloud_migrations:
    name: Cloud Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      verdict: ${{ steps.check.outputs.verdict }}
      typecheck: ${{ steps.detect.outputs.typecheck }}
      build: ${{ steps.detect.outputs.build }}
      test: ${{ steps.detect.outputs.test }}
      test_packages: ${{ steps.detect.outputs.test_packages }}
      test_web: ${{ steps.detect.outputs.test_web }}
      test_server: ${{ steps.detect.outputs.test_server }}
      rust: ${{ steps.detect.outputs.rust }}
      release_smoke: ${{ steps.detect.outputs.release_smoke }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      # Share this checkout rather than consuming another runner for detection.
      # Main and unknown paths keep full coverage; fork guards always run.
      - name: Detect affected jobs
        id: detect
        uses: ./.github/actions/ci-changes

      - name: Check cloud migrations
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        # A pull request's checkout is GitHub's merge of it into its base, whose
        # first parent is that base: comparing the two judges what merging does.
        # The PR head alone lacks whatever the base merged since it branched,
        # which would read as removing those migrations.
        run: |
          case "$EVENT_NAME" in
            pull_request | push) set -- --base HEAD^1 ;;
            *) set -- --base origin/main ;;
          esac
          node scripts/cloud-migrations/check.ts "$@"

  # This repo is public: lines the fork adds over upstream must not carry real
  # emails, people, or employers. The denylist is a repository secret because
  # it is personal data itself; fork PRs without it get the email check only.
  personal_data:
    name: Personal Data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: scripts/personal-data

      - name: Fetch upstream
        run: git fetch --no-tags --filter=blob:none https://github.com/pingdotgg/t3code main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Check added lines for personal data
        env:
          PERSONAL_DATA_DENYLIST: ${{ secrets.PERSONAL_DATA_DENYLIST }}
        run: node scripts/personal-data/check.ts --upstream FETCH_HEAD

  # One required check for branch protection. Only path detection may authorize a
  # skipped job. Failures, cancellations and every other skip still fail.
  check:
    name: Check
    if: ${{ always() }}
    needs:
      [
        lint,
        typecheck,
        build,
        test,
        test_web,
        test_server,
        rust,
        release_smoke,
        upstream_merge,
        cloud_migrations,
        personal_data,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '.cloud_migrations.outputs as $gates
            | all(to_entries[];
                .value.result == "success"
                or (.value.result == "skipped" and $gates[.key] == "false"))' > /dev/null
