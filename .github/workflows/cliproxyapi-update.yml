# Signalbox-only. Keeps the managed-pool image and self-hosted installer on
# one checksummed CLIProxyAPI release manifest.
name: CLIProxyAPI release sync

on:
  push:
    branches: [main]
    paths:
      - apps/cloud/containers/cliproxyapi/release.json
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: cliproxyapi-release-sync
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
      UPSTREAM_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
          fetch-depth: 0

      - name: Require the owner token
        run: |
          if [[ -z "$UPSTREAM_SYNC_TOKEN" ]]; then
            echo "UPSTREAM_SYNC_TOKEN is required so the release PR runs preview and CI workflows as JustYannicc." >&2
            exit 1
          fi

      - name: Prepare an evidenced rollback for a held pin
        id: rollback
        run: bash "$GITHUB_WORKSPACE/scripts/cliproxyapi/prepare-backstop.sh"

      - name: Read the latest upstream release
        id: release
        if: steps.rollback.outputs.rollback != 'true'
        run: |
          gh api repos/router-for-me/CLIProxyAPI/releases/latest > "$RUNNER_TEMP/cliproxyapi-release.json"
          tag="$(jq -r '.tag_name' "$RUNNER_TEMP/cliproxyapi-release.json")"
          version="${tag#v}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected stable release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Respect release holds
        id: policy
        if: steps.rollback.outputs.rollback != 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git show origin/main:apps/cloud/containers/cliproxyapi/release.json > "$RUNNER_TEMP/cliproxyapi-current.json"
          policy="$(python3 -m scripts.cliproxyapi.release_policy "$RUNNER_TEMP/cliproxyapi-current.json" "$VERSION")"
          held="$(jq -r '.held' <<< "$policy")"
          echo "held=$held" >> "$GITHUB_OUTPUT"
          if [[ "$held" == "true" ]]; then
            echo "CLIProxyAPI $VERSION is held; leaving the pin and update branch alone." >> "$GITHUB_STEP_SUMMARY"
            jq -r '.holds[] | "- \(.reason) (\(.upstreamIssue)); reproduction: \(.reproduction)"' <<< "$policy" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare the update branch
        id: branch
        if: steps.policy.outputs.held == 'false'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          manifest=apps/cloud/containers/cliproxyapi/release.json
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          current="$(git show "origin/main:$manifest" | jq -er '.version')"
          if [[ -z "$current" ]]; then
            echo "Could not read the current CLIProxyAPI manifest from origin/main." >&2
            exit 1
          fi
          if [[ "$current" == "$VERSION" ]]; then
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "existing_pr=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! python3 -c 'import sys; sys.exit(0 if tuple(map(int, sys.argv[1].split("."))) < tuple(map(int, sys.argv[2].split("."))) else 1)' "$current" "$VERSION"; then
            echo "Latest tag $VERSION is not newer than the pinned version $current; refusing a downgrade." >&2
            exit 1
          fi

          branch=automation/cliproxyapi-update
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch"
            branch_base="$(git merge-base origin/main "origin/$branch")"
            changed="$(git diff --name-only "$branch_base" "origin/$branch")"
            if [[ -n "$changed" && "$changed" != "$manifest" ]]; then
              echo "The release branch contains unrelated changes; preserving it." >&2
              exit 1
            fi
          fi
          existing_pr="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')"
          branch_version=""
          branch_holds="[]"
          if git show "origin/$branch:$manifest" >/dev/null 2>&1; then
            branch_version="$(git show "origin/$branch:$manifest" | jq -r '.version')"
            git show "origin/$branch:$manifest" > "$RUNNER_TEMP/cliproxyapi-branch.json"
            branch_holds="$(jq -cS '.holds // []' "$RUNNER_TEMP/cliproxyapi-branch.json")"
            if [[ -n "$existing_pr" ]]; then
              branch_base="$(git merge-base origin/main "origin/$branch")"
              git show "$branch_base:$manifest" > "$RUNNER_TEMP/cliproxyapi-branch-base.json"
              policy="$(python3 -m scripts.cliproxyapi.release_policy "$RUNNER_TEMP/cliproxyapi-current.json" "$VERSION" "$RUNNER_TEMP/cliproxyapi-branch.json" "$RUNNER_TEMP/cliproxyapi-branch-base.json")"
              if [[ "$(jq -r '.held' <<< "$policy")" == "true" ]]; then
                printf 'update=false\nexisting_pr=%s\n' "$existing_pr" >> "$GITHUB_OUTPUT"
                echo "The open release PR holds $VERSION; preserving that PR and its evidence." >> "$GITHUB_STEP_SUMMARY"
                jq -r '.holds[] | "- \(.reason) (\(.upstreamIssue)); reproduction: \(.reproduction)"' <<< "$policy" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
          fi
          echo "existing_pr=$existing_pr" >> "$GITHUB_OUTPUT"
          current_holds="$(jq -cS '.holds // []' "$RUNNER_TEMP/cliproxyapi-current.json")"
          if [[ "$branch_version" == "$VERSION" && -n "$existing_pr" && "$branch_holds" == "$current_holds" ]]; then
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'update=true\ncurrent=%s\nbranch=%s\n' "$current" "$branch" >> "$GITHUB_OUTPUT"
          git checkout -B "$branch" origin/main

      - name: Download upstream checksums
        if: steps.branch.outputs.update == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/cliproxyapi-release"
          gh release download "$TAG" \
            --repo router-for-me/CLIProxyAPI \
            --pattern checksums.txt \
            --dir "$RUNNER_TEMP/cliproxyapi-release"

      - name: Require managed-pool carry patches to apply
        id: source
        if: steps.branch.outputs.update == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git clone --depth 1 --branch "$TAG" --single-branch \
            https://github.com/router-for-me/CLIProxyAPI.git \
            "$RUNNER_TEMP/cliproxyapi-source"
          source_commit="$(git -C "$RUNNER_TEMP/cliproxyapi-source" rev-parse HEAD)"
          if [[ ! "$source_commit" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Could not resolve $TAG to a full source commit." >&2
            exit 1
          fi
          echo "commit=$source_commit" >> "$GITHUB_OUTPUT"
          apps/cloud/containers/cliproxyapi/apply-carry-patches.sh \
            "$RUNNER_TEMP/cliproxyapi-source" --check

      - name: Update the shared release manifest
        if: steps.branch.outputs.update == 'true'
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: >-
          python3 -m scripts.cliproxyapi.update
          "$RUNNER_TEMP/cliproxyapi-release.json"
          "$RUNNER_TEMP/cliproxyapi-release/checksums.txt"
          "$SOURCE_COMMIT"
          apps/cloud/containers/cliproxyapi/release.json

      - name: Prepare pull request labels and description
        if: steps.branch.outputs.update == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          gh label create cli-proxyapi-update --color 1d76db --description "Automated CLIProxyAPI release sync" --force
          cat > "$RUNNER_TEMP/cliproxyapi-pr-body.md" <<EOF
          Updates the shared CLIProxyAPI release manifest to [$TAG](https://github.com/router-for-me/CLIProxyAPI/releases/tag/$TAG). The manifest contains the version, exact source commit, all self-hosted assets and checksums, and the managed-pool image asset. The Docker build and account-hub installer read the same file; the managed-pool image builds the source commit and applies the Codex device-login and Claude manual OAuth carry patches.

          The container smoke test, Cloud preview deploy and all repository checks must pass before GitHub auto-merges this PR. The scheduled updater verifies every pinned asset against upstream's release metadata and checksums.txt.

          The final hold recheck leaves a seconds-long race; if a held pin merges, the next release-sync check automatically prepares an evidenced rollback through the same smoke, deploy and CI gates.

          Upstream release notes: https://github.com/router-for-me/CLIProxyAPI/releases/tag/$TAG
          EOF

          pr="$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')"
          if [[ -n "$pr" ]]; then
            gh pr edit "$pr" \
              --title "chore(cloud): update CLIProxyAPI to $TAG" \
              --body-file "$RUNNER_TEMP/cliproxyapi-pr-body.md" \
              --add-label cli-proxyapi-update
          fi

      - name: Describe the evidenced rollback
        if: steps.rollback.outputs.rollback == 'true'
        env:
          VERSION: ${{ steps.rollback.outputs.version }}
          BRANCH: ${{ steps.rollback.outputs.branch }}
        run: |
          gh label create cli-proxyapi-update --color 1d76db --description "Automated CLIProxyAPI release sync" --force
          gh label create cli-proxyapi-rollback --color B60205 --description "Evidenced CLIProxyAPI held-pin rollback" --force
          pr="$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')"
          if [[ -n "$pr" ]]; then
            gh pr edit "$pr" --title "fix(cloud): roll CLIProxyAPI back to v$VERSION" \
              --body-file "$RUNNER_TEMP/cliproxyapi-pr-body.md" \
              --add-label cli-proxyapi-update --add-label cli-proxyapi-rollback
          fi

      - name: Commit and push the update branch
        if: steps.branch.outputs.update == 'true' || steps.rollback.outputs.push == 'true'
        env:
          VERSION: ${{ steps.rollback.outputs.version || steps.release.outputs.version }}
          BRANCH: ${{ steps.rollback.outputs.branch || steps.branch.outputs.branch }}
          EXPECTED_BASE: ${{ steps.rollback.outputs.base_sha }}
          EXPECTED_BRANCH: ${{ steps.rollback.outputs.branch_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/cloud/containers/cliproxyapi/release.json
          if [[ -n "$EXPECTED_BASE" ]]; then
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            manifest=apps/cloud/containers/cliproxyapi/release.json
            if [[ "$(git rev-parse "origin/main:$manifest")" != "$(git rev-parse "$EXPECTED_BASE:$manifest")" ]]; then
              echo "The release manifest changed while preparing the rollback; preserving its newer metadata." >&2
              exit 1
            fi
            git commit -m "fix(cloud): roll CLIProxyAPI back to v$VERSION"
            git push --force-with-lease="refs/heads/$BRANCH:$EXPECTED_BRANCH" origin "HEAD:refs/heads/$BRANCH"
          else
            git commit -m "chore(cloud): update CLIProxyAPI to v$VERSION"
            git push --force-with-lease origin "$BRANCH"
          fi

      - name: Clear auto-merge for the updated commit
        if: steps.branch.outputs.update == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          pr="$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')"
          if [[ -z "$pr" ]]; then exit 0; fi
          auto_merge="$(gh pr view "$pr" --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [[ "$auto_merge" == "true" ]]; then gh pr merge "$pr" --disable-auto; fi
          if [[ "$(gh pr view "$pr" --json labels --jq 'any(.labels[]; .name == "cli-proxyapi-rollback")')" == "true" ]]; then
            gh pr edit "$pr" --remove-label cli-proxyapi-rollback
          fi

      - name: Create the release pull request
        if: steps.branch.outputs.update == 'true' || steps.rollback.outputs.rollback == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          BRANCH: ${{ steps.rollback.outputs.branch || steps.branch.outputs.branch }}
          ROLLBACK_VERSION: ${{ steps.rollback.outputs.version }}
        run: |
          title="chore(cloud): update CLIProxyAPI to $TAG"
          if [[ -n "$ROLLBACK_VERSION" ]]; then title="fix(cloud): roll CLIProxyAPI back to v$ROLLBACK_VERSION"; fi
          pr="$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')"
          if [[ -z "$pr" ]]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$title" \
              --body-file "$RUNNER_TEMP/cliproxyapi-pr-body.md" \
              --label cli-proxyapi-update
            if [[ -n "$ROLLBACK_VERSION" ]]; then gh pr edit "$BRANCH" --add-label cli-proxyapi-rollback; fi
          fi

      - name: Close a stale release problem
        if: steps.policy.outputs.held == 'false' && steps.branch.outputs.update != 'true' && steps.branch.outputs.existing_pr == ''
        env:
          CLOSE_REASON: The pinned version matches the latest stable release.
        run: node scripts/cliproxyapi/report-problem.mjs close

      - name: Report the held-pin rollback
        if: steps.rollback.outputs.rollback == 'true'
        env:
          PREVIOUS: ${{ steps.rollback.outputs.previous }}
          VERSION: ${{ steps.rollback.outputs.version }}
          BRANCH: ${{ steps.rollback.outputs.branch }}
        run: |
          pr_url="$(gh pr view "$BRANCH" --json url --jq '.url')"
          export PROBLEM_SUMMARY="The held CLIProxyAPI $PREVIOUS pin has an evidenced rollback to $VERSION awaiting release gates."
          export PROBLEM_DETAILS
          PROBLEM_DETAILS="$(cat "$RUNNER_TEMP/cliproxyapi-pr-body.md")

          Rollback PR: $pr_url"
          node scripts/cliproxyapi/report-problem.mjs report

      - name: Report a blocked release sync
        if: failure()
        env:
          PROBLEM_SUMMARY: The scheduled release sync could not prepare a verified update.
          PROBLEM_DETAILS: Check this action run for a missing release asset, checksum problem, a managed-pool carry patch that no longer applies, or a failed GitHub operation. The pinned manifest was not advanced.
        run: node scripts/cliproxyapi/report-problem.mjs report
