name: Sweep Signalbox Cloud previews

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      cleanup_legacy_preview_packs:
        description: Delete unprefixed objects from signalbox-drives-preview
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  sweep:
    name: Delete closed preview resources
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: cloud-preview-sweep
      cancel-in-progress: false
    environment:
      name: cloud-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      CLEANUP_LEGACY_PREVIEW_PACKS: ${{ inputs.cleanup_legacy_preview_packs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sweep closed pull request previews
        run: bash .github/scripts/sweep-cloud-previews.sh
