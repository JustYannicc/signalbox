name: Sweep Signalbox Cloud previews

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      cleanup_legacy_preview_packs:
        description: Delete unprefixed objects from signalbox-drives-preview. Only once every preview deployed before PR prefixes has closed.
        required: false
        type: boolean
        default: false
      backfill_preview_links:
        description: Ask every production PoolObject to drop links for PRs closed in the last 90 days, including links made before the registry. One-off; wakes every pool.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  # Deletes closed pull requests' Runner images (pr-<number>).
  packages: write

jobs:
  sweep:
    name: Delete closed preview resources
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: cloud-preview-sweep
      cancel-in-progress: false
    environment:
      name: cloud-production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      CLEANUP_LEGACY_PREVIEW_PACKS: ${{ inputs.cleanup_legacy_preview_packs }}
      BACKFILL_PREVIEW_LINKS: ${{ inputs.backfill_preview_links }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Each closed preview's Alchemy stage is destroyed through the stack.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@signalbox/cloud...

      - name: Sweep closed pull request previews
        run: bash .github/scripts/sweep-cloud-previews.sh
