# Signalbox-only: builds the Runner image every thread VM runs (Node, git,
# the Runner, pinned claude and codex) and publishes it to
# ghcr.io/justyannicc/signalbox-runner. Its own file so upstream merges never
# touch it. See docs/operations/cloud.md.
#
# - nightly: every night from main, as `nightly` and `nightly-<date>-<sha>`,
#   and after every production deploy of a push that changes the Runner
#   (deploy-cloud.yml calls this once the cloud is live).
# - stable: every `vX.Y.Z` tag, as `X.Y.Z` and `stable`.
# - pr-<number>: a pull request's preview (deploy-cloud.yml calls this before it
#   deploys), so its boat machines run the pull request's Runner. Deleted with
#   the preview (.github/scripts/runner-pr-images.sh).
# - Other pull requests that change the Runner build the image without publishing it.
name: Runner image

on:
  schedule:
    - cron: "23 2 * * *"
  push:
    tags:
      - "v*.*.*"
      - "!v*-nightly.*"
      - "!v*-preview.*"
  pull_request:
    # Also in deploy-cloud.yml: its paths, and `runner_changes`' pattern.
    paths:
      - apps/server/src/signalbox/runner/**
      - apps/server/src/preview/**
      - apps/server/src/orchestration-v2/Adapters/**
      # The Runner compiles and forwards agents' automations.
      - apps/server/src/workflows/**
      - packages/automation-compiler/**
      - packages/runner-protocol/**
      - packages/automations/**
      - apps/cloud/infra/runner-images.alchemy.ts
      - apps/cloud/infra/runnerImagePublication.ts
      - apps/cloud/infra/kernelPrograms/machine-files/**
      - .github/workflows/runner-image.yml
  workflow_call:
    inputs:
      pr_number:
        description: "Publish as pr-<number>, for that pull request's preview"
        required: false
        default: ""
        type: string
      channel:
        description: "Publish to this channel instead (nightly)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Build and smoke test without publishing"
        required: false
        default: false
        type: boolean
    outputs:
      image:
        description: The published image pinned by digest
        value: ${{ jobs.image.outputs.image }}
      machine_file_inventory:
        description: The generated machine file inventory artifact name
        value: ${{ jobs.image.outputs.machine_file_inventory }}
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel to publish"
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - stable

permissions:
  contents: read

env:
  IMAGE: ghcr.io/justyannicc/signalbox-runner

jobs:
  image:
    name: Build Runner image
    # A pull request with a preview builds and publishes through deploy-cloud.yml's call instead.
    if: >-
      github.event_name != 'pull_request' ||
      inputs.pr_number != '' ||
      github.event.pull_request.user.login != 'JustYannicc' ||
      github.event.pull_request.head.repo.full_name != github.repository
    # Per job: a called run and the pull request's own run must not cancel each other.
    concurrency:
      # A dry run gets its own group, so it never replaces a publish waiting to start.
      group: runner-image-${{ inputs.pr_number != '' && format('pr-{0}', inputs.pr_number) || github.ref }}${{ inputs.dry_run && '-dry' || '' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.inventory.outputs.image_ref }}
      machine_file_inventory: ${{ steps.inventory.outputs.artifact_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3...
              - --filter=@signalbox/cloud...

      - name: Bundle the Runner
        working-directory: apps/server
        run: vp run runner:bundle

      - name: Tags
        id: tags
        env:
          EVENT: ${{ github.event_name }}
          CHANNEL: ${{ inputs.channel }}
          PR_NUMBER: ${{ inputs.pr_number }}
          DRY_RUN: ${{ inputs.dry_run }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          short_sha="${GITHUB_SHA::12}"
          push=true
          if [ -n "$PR_NUMBER" ]; then
            tags="$IMAGE:pr-$PR_NUMBER"
          elif [ "$EVENT" = "pull_request" ]; then
            push=false
            tags="$IMAGE:pr-${{ github.event.pull_request.number }}"
          elif [ "$CHANNEL" = "stable" ] || { [ -z "$CHANNEL" ] && [ "$REF_TYPE" = "tag" ]; }; then
            if [ "$REF_TYPE" = "tag" ]; then version="${REF_NAME#v}"; else version="$(jq -r .version apps/server/package.json)"; fi
            tags="$IMAGE:$version,$IMAGE:stable"
          else
            tags="$IMAGE:nightly,$IMAGE:nightly-$(date -u +%Y%m%d)-$short_sha"
          fi
          if [ "$DRY_RUN" = "true" ]; then push=false; fi
          {
            echo "push=$push"
            echo "tags=$tags"
            echo "first=${tags%%,*}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.tags.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/server/dist/runner
          file: apps/server/src/signalbox/runner/image/Dockerfile
          platforms: linux/amd64
          load: true
          # Unchanged apt and npm layers keep their digests, so machines only pull what changed.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SIGNALBOX_RUNNER_REVISION=${{ github.sha }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Signalbox Runner: drives claude and codex on a thread's machine

      # The Runner starts and waits for its machine config; the CLIs, pnpm, the
      # browser and the everyday tools agents reach for answer, and HTTPS trusts
      # public certificates (#595).
      - name: Smoke test
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          image="${TAGS%%,*}"
          docker run --rm --entrypoint sh --env COREPACK_ENABLE_DOWNLOAD_PROMPT=0 "$image" -c '
            git --version && claude --version && codex --version && pnpm --version && "$SIGNALBOX_BROWSER_EXECUTABLE" --version &&
            wget --version >/dev/null && jq --version && unzip -v >/dev/null && git lfs version &&
            git config --system filter.lfs.process && curl -fsS -o /dev/null https://example.com'
          # Playwright and 1Password's SDK load from beside the Runner.
          docker run --rm --entrypoint node --workdir /opt/signalbox "$image" -e 'require("playwright-core"); require("@1password/sdk")'
          status=0
          timeout 10 docker run --rm --name runner-smoke "$image" machine --config /tmp/none.json || status=$?
          docker rm --force runner-smoke >/dev/null 2>&1 || true
          test "$status" -eq 124

      - name: Capture machine file metadata
        id: capture
        env:
          RUNNER_IMAGE_ID: ${{ steps.build.outputs.imageid }}
          PLATFORM: linux/amd64
          SIGNALBOX_RUNNER_REVISION: ${{ github.sha }}
        run: |
          docker run --rm --read-only --platform "$PLATFORM" --network none --user 0:0 \
            --entrypoint node \
            --mount "type=bind,src=$GITHUB_WORKSPACE/apps/cloud/infra/kernelPrograms/machine-files,dst=/tmp/capture,readonly" \
            --env SIGNALBOX_RUNNER_IMAGE_ID="$RUNNER_IMAGE_ID" \
            --env SIGNALBOX_RUNNER_PLATFORM="$PLATFORM" \
            --env SIGNALBOX_RUNNER_REVISION="$SIGNALBOX_RUNNER_REVISION" \
            "$RUNNER_IMAGE_ID" /tmp/capture/capture.mjs \
            > "$RUNNER_TEMP/runner-machine-files.snapshot.json"

      # The pull request's previous image, which this push untags.
      - name: Find the image this replaces
        id: previous
        if: steps.tags.outputs.push == 'true' && inputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          # Best effort: a version left behind costs storage, not a preview.
          ids="$(bash .github/scripts/runner-pr-images.sh ids "$PR_NUMBER")" || {
            echo "::warning::Could not list PR #$PR_NUMBER's Runner image versions."
            ids=''
          }
          echo "ids=$(tr '\n' ' ' <<< "$ids")" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: steps.tags.outputs.push == 'true'
        working-directory: apps/cloud
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          RUNNER_IMAGE_ID: ${{ steps.build.outputs.imageid }}
          GITHUB_TOKEN: ${{ github.token }}
          ALCHEMY_TELEMETRY_DISABLED: "1"
        run: |
          ./node_modules/.bin/alchemy deploy infra/runner-images.alchemy.ts \
            --stage "run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --yes --no-input

      # What a fresh machine gets: it pulls the channel's tag when its Runner
      # starts (BoatMachineBackend.ts), and must find this commit in it.
      - name: Check the published revision
        if: steps.tags.outputs.push == 'true'
        env:
          IMAGE_TAG: ${{ steps.tags.outputs.first }}
        run: |
          revision="$(docker buildx imagetools inspect "$IMAGE_TAG" \
            --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}')"
          if [ "$revision" != "$GITHUB_SHA" ]; then
            echo "::error::$IMAGE_TAG runs ${revision:-no revision}, not $GITHUB_SHA."
            exit 1
          fi
          echo "$IMAGE_TAG runs $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"

      - name: Pin the machine file inventory
        id: inventory
        if: steps.tags.outputs.push == 'true'
        env:
          IMAGE_TAG: ${{ steps.tags.outputs.first }}
          IMAGE_REPOSITORY: ${{ env.IMAGE }}
          RUNNER_IMAGE_ID: ${{ steps.build.outputs.imageid }}
          PLATFORM: linux/amd64
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE_TAG" --format '{{.Digest}}')"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Could not resolve a published image digest for $IMAGE_TAG."
            exit 1
          fi
          image_ref="$IMAGE_REPOSITORY@$digest"
          docker pull --quiet --platform "$PLATFORM" "$image_ref"
          published_id="$(docker image inspect "$image_ref" --format '{{.Id}}')"
          if [[ "$published_id" != "$RUNNER_IMAGE_ID" ]]; then
            echo "::error::$image_ref resolves to $published_id, not the captured build $RUNNER_IMAGE_ID."
            exit 1
          fi
          node apps/cloud/infra/kernelPrograms/machine-files/prepare.mjs \
            --snapshot "$RUNNER_TEMP/runner-machine-files.snapshot.json" \
            --image-repository "$IMAGE_REPOSITORY" \
            --image-ref "$image_ref" \
            --source-image-id "$RUNNER_IMAGE_ID" \
            --source-revision "$SOURCE_REVISION" \
            --platform "$PLATFORM" \
            --dockerfile apps/server/src/signalbox/runner/image/Dockerfile \
            --output apps/cloud/infra/kernelPrograms/machine-files/build/runner.json
          artifact_name="runner-machine-files-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "image_ref=$image_ref"
            echo "artifact_name=$artifact_name"
          } >> "$GITHUB_OUTPUT"

      - name: Upload machine file inventory
        if: steps.tags.outputs.push == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.inventory.outputs.artifact_name }}
          path: apps/cloud/infra/kernelPrograms/machine-files/build/runner.json
          if-no-files-found: error
          retention-days: 1

      - name: Delete the image this replaced
        if: steps.previous.outputs.ids != ''
        env:
          GH_TOKEN: ${{ github.token }}
          IDS: ${{ steps.previous.outputs.ids }}
        run: |
          # shellcheck disable=SC2086 # One argument per version id.
          bash .github/scripts/runner-pr-images.sh delete-untagged $IDS
