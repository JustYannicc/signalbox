name: Spike Lunora 847
on:
  push:
    branches: [spike/lunora-847]
    paths: [spikes/lunora847/**, .github/workflows/spike-lunora-847.yml]
permissions:
  contents: read
concurrency:
  group: spike-lunora-847
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: spikes/lunora847
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: spikes/lunora847
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
          run_install: false
          package_json_file: spikes/lunora847/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install fixture only
        run: pnpm install --frozen-lockfile --ignore-scripts --child-concurrency=1 --network-concurrency=2
      - name: Build and check fixture
        run: |
          node scripts/build.mjs
          ./node_modules/.bin/tsc --noEmit
          ./node_modules/.bin/wrangler deploy --dry-run --outdir dist 2>&1 | tee build.log
          sha256sum package.json pnpm-lock.yaml dist/worker.js > hashes.txt
      - name: Deploy isolated synthetic fixture
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ./node_modules/.bin/wrangler deploy 2>&1 | tee deploy.log
      - name: Measure remote sync
        env:
          SPIKE_URL: https://signalbox-847-lunora-spike.yannic-bb0.workers.dev
          SPIKE_IDLE_MS: 90000
          SPIKE_TABS: 64
        run: ./node_modules/.bin/vitest run --maxWorkers=2 2>&1 | tee test-remote.log
      - name: Delete isolated Worker and Durable Objects
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ./node_modules/.bin/wrangler delete --force 2>&1 | tee cleanup.log
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lunora-847-measurements-${{ github.sha }}
          path: |
            spikes/lunora847/results.json
            spikes/lunora847/*.log
            spikes/lunora847/hashes.txt
            spikes/lunora847/client-meta.json
          retention-days: 30
