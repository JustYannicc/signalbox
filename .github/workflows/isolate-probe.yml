# Measures V8 and Durable Object limits against an isolated Alchemy probe.
name: Isolate limits probe

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/isolate-probe.yml
      - apps/cloud/infra/isolateProbe/**

permissions:
  contents: read
  pull-requests: read

env:
  ALCHEMY_TELEMETRY_DISABLED: "1"
  NO_COLOR: "1"

jobs:
  isolate-probe:
    if: >-
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cloud-preview
    concurrency:
      group: isolate-probe-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        id: setup
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@signalbox/cloud...
              - --filter=@t3tools/monorepo

      - name: Prepare generated probe modules
        run: node --experimental-strip-types apps/cloud/infra/isolateProbe/prepare.ts

      - name: Test isolate probe fixtures
        working-directory: apps/cloud
        run: ../../node_modules/.bin/vp test run --config ../../vite.config.ts infra/isolateProbe/*.test.ts --maxWorkers=2

      - name: Typecheck isolate probe
        run: ./node_modules/.bin/tsc-rs --noEmit -p apps/cloud/infra/isolateProbe/tsconfig.json

      - name: Measure local workerd probe
        run: node --experimental-strip-types apps/cloud/infra/isolateProbe/measure.ts --output "$RUNNER_TEMP/isolate-local.json"

      - name: Run deployed isolated probe
        id: deployed
        timeout-minutes: 14
        run: >-
          node --experimental-strip-types apps/cloud/infra/isolateProbe/run.ts
          --stage-file "$RUNNER_TEMP/isolate-probe-stage"
          --output "$RUNNER_TEMP/deployed.json"

      - name: Recover interrupted probe stage
        if: always()
        timeout-minutes: 3
        shell: bash
        run: |
          if [[ -e "$RUNNER_TEMP/isolate-probe-stage" || -L "$RUNNER_TEMP/isolate-probe-stage" ]]; then
            node --experimental-strip-types apps/cloud/infra/isolateProbe/run.ts \
              --recover-stage-file "$RUNNER_TEMP/isolate-probe-stage"
          fi

      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolate-probe-pr-${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/isolate-local.json
            ${{ runner.temp }}/deployed.json
          if-no-files-found: warn
          retention-days: 14
